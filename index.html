<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>CardQuest</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=0.16.16">
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="logo">CardQuest<small id="ver-label">v0.9.0</small></div>
    <!-- 2026-08-29：タブは「ラン」だけにした。ストーリー中は戦闘に入ってもここは動かない
         （以前は戦闘のたびに「バトル画面（検証）」へ光が移っていたが、プレイヤーが
         自分で行き来する意味が無いため）。デッキ編集とフリーバトルは開発用なので
         右の 🛠 デバッグメニューから開く。 -->
    <div class="tabs">
      <button class="tab on" data-screen="screen-run">ラン</button>
    </div>
    <!-- 開発用の専用コマンド置き場（2026-08-29）。使われていなかった「エンジン検証」
         「この案について」タブを外し、代わりにここへ検証用の道具をまとめた。 -->
    <button class="dbg-btn" id="dbg-btn" title="デバッグメニュー">🛠</button>
  </div>

  <!-- ===== ラン（分岐マップ・M6） ===== -->
  <section class="screen on" id="screen-run">
    <div id="run-root"></div>
  </section>

  <!-- ===== バトル画面。ラン中の戦闘と、デバッグメニューの「フリーバトル」の両方がここを使う ===== -->
  <section class="screen" id="screen-battle">
    <div class="statusbar">
      <div class="side enemy">
        <span class="who" id="foe-name">相手</span>
        <span class="lp" id="foe-lp">♥ 10</span>
        <span class="meta">手札</span>
        <span id="ehand"></span>
        <span class="meta">デッキ <b id="foe-deck">50</b></span>
      </div>
      <div id="turnbox"></div>
      <div class="side mine">
        <span class="meta">デッキ <b id="my-deck">50</b></span>
        <span class="lp" id="my-lp">♥ 10</span>
        <span class="who" id="my-name">あなた</span>
      </div>
    </div>

    <div class="battle-row">
      <div class="board" id="board"></div>
      <div id="info-fix"></div>
    </div>

    <div class="hand-wrap">
      <div class="hand" id="hand"></div>
      <div class="acts" id="acts"></div>
    </div>
  </section>

  <!-- ===== デッキ編集画面（開発用。アンロックに関係なく全169種から組める。
       ここで組んだデッキが「フリーバトル」の自分のデッキになる） ===== -->
  <section class="screen" id="screen-deck">
    <div class="deck-wrap">
      <div class="deck-main">
        <div class="deck-tabs">
          <button class="dtab U on" data-t="U">⚔ モンスター</button>
          <button class="dtab M" data-t="M">✦ 魔法</button>
          <button class="dtab S" data-t="S">✚ 技能</button>
          <div class="deck-count" id="deck-count"></div>
          <!-- 開発用画面なので戻り道を明示しておく。
               ストーリーへ戻るのは右上の「ラン」タブが担うので、ここには置かない
               （2つ並べるとこの行に収まらず、文字が折れてしまった）。 -->
          <button class="tiny deck-back" data-back="screen-free">フリーバトルへ</button>
        </div>
        <div class="colbar" id="colbar"></div>
        <div class="tbl-scroll">
          <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
        </div>
      </div>
      <div class="detail" id="detail"></div>
    </div>
  </section>

  <!-- ===== フリーバトル設定（開発用・2026-08-29） =====
       デッキ編集で組んだデッキを使い、相手・先攻後攻・戦場ルールを選んで戦う。 -->
  <section class="screen" id="screen-free">
    <div id="free-root"></div>
  </section>

  <!-- 一時メッセージ。#app の中に置くことで画面と一緒に縮み、必ず見える位置に出る -->
  <div id="flash"></div>
</div>

<!-- 起動時のローディング（2026-08-29）。CSSが届く前でも必ず出るよう、見た目はここに直書きする。
     js/boot.js が主要な絵を先読みしながらバーを進め、読み終わったら自分で消える。 -->
<div id="boot" style="position:fixed;inset:0;z-index:9999;background:#0b1220;color:#e8eefc;
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
     font-family:system-ui,-apple-system,'Segoe UI','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;
     transition:opacity .4s ease">
  <div style="font-size:30px;font-weight:800;letter-spacing:.08em">CardQuest</div>
  <div style="width:min(420px,64vw);height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden">
    <div id="boot-bar" style="width:0;height:100%;border-radius:99px;
         background:linear-gradient(90deg,#facc15,#fde68a);transition:width .25s ease-out"></div>
  </div>
  <div style="font-size:13px;color:#96a7c6">読み込んでいます… <span id="boot-pct">0%</span></div>
</div>

<div id="sa-probe"></div>

<script src="js/boot.js?v=0.16.16"></script>
<script src="js/data.js?v=0.16.16"></script>
<script src="js/engine/rng.js?v=0.16.16"></script>
<script src="js/engine/state.js?v=0.16.16"></script>
<script src="js/engine/stats.js?v=0.16.16"></script>
<script src="js/engine/fieldrules.js?v=0.16.16"></script>
<script src="js/engine/turn.js?v=0.16.16"></script>
<script src="js/engine/combat.js?v=0.16.16"></script>
<script src="js/engine/effects/magic.js?v=0.16.16"></script>
<script src="js/engine/effects/units.js?v=0.16.16"></script>
<script src="js/engine/ai.js?v=0.16.16"></script>
<script src="js/engine/search.js?v=0.16.16"></script>
<script src="js/meta/collection.js?v=0.16.16"></script>
<script src="js/run/areas.js?v=0.16.16"></script>
<script src="js/run/map.js?v=0.16.16"></script>
<script src="js/run/run.js?v=0.16.16"></script>
<script src="js/meta/save.js?v=0.16.16"></script>
<script src="js/lore.js?v=0.16.16"></script>
<script src="js/version.js?v=0.16.16"></script>
<script src="js/layout.js?v=0.16.16"></script>
<script src="js/run-ui.js?v=0.16.16"></script>
<script src="js/debug.js?v=0.16.16"></script>
<script src="js/update.js?v=0.16.16"></script>
</body>
</html>
